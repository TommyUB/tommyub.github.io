<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rumble Embed Test</title>
</head>
<body>

    <h2>Rumble API Test</h2>
    <button onclick="getAndShowVideo()">Fetch Video</button>
    
    <div id="videoDisplay"></div>

<script>
async function getAndShowVideo() {
    var videoDisplay = document.getElementById('videoDisplay');
    
    // The regular video URL you provided
    var cleanUrl = "rumble.com/v7e0ekw-trump-changes-childhood-vaccines-iran-tensions-royal-family-feud-daily-news.html";
    
    // The exact Rumble API URL we used before
    var apiUrl = "https://rumble.com/api/Media/oembed.json?url=" + encodeURIComponent(cleanUrl);
    //alert(apiUrl);
    try {
        // Pull data directly from the server
        var response = await fetch(apiUrl);
        var data = await response.json();
        
        // Rumble sends a full <iframe> string inside the 'html' text property
        // This regex pulls the exact text matching inside src="..."
        var match = data.html.match(/src="([^"]+)"/);
        alert(match);
        if (match && match[1]) {
            alert("match && match[1]")            
            var embedUrl = match[1]; // This holds the correct embedded video ID link!

            // Put it inside an iframe
            var iframe = document.createElement('iframe');
            iframe.src = embedUrl;
            iframe.width = "640";
            iframe.height = "360";
            iframe.allowFullscreen = true;
            
            videoDisplay.appendChild(iframe);
        }
    } catch (error) {
        alert("Error pulling from server: " + error);
    }
}
</script>

</body>
</html>
