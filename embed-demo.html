<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posting Videos Fix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .composer {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 80px;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 15px;
        }
        .controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }
        button {
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #166fe5;
        }
        .feed {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .post {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .post-text {
            font-size: 15px;
            margin-bottom: 12px;
            white-space: pre-wrap;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .hint {
            font-size: 12px;
            color: #65676b;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Proving it can be easily fixed.</h2>
    <p>Paste a Video Embed URL to see the auto-iframe wrapper solution in action.</p>
    
    <div class="composer">
        <textarea id="postText" placeholder="Write something or paste a video link..."></textarea>
        <div class="hint">Try standard YouTube links, Odysee links or direct Rumble embed URLs.  You must use the embed link on Rumble for an embedded player.</div>
        <div class="controls">
            <button onclick="createPost()">Post to Feed</button>
        </div>
    </div>

    <div class="feed" id="postFeed"></div>
</div>

<script>
function extractVideoEmbed(text) {
    // 1. Direct Embed Link Catch (If they paste a raw /embed/ link)
    if (text.includes("/embed/")) {
        var startIndex = text.indexOf("http");
        if (startIndex !== -1) {
            var remainingText = text.substring(startIndex);
            var endIndex = remainingText.search(/[\s"'>]/);
            if (endIndex !== -1) {
                return remainingText.substring(0, endIndex);
            }
            return remainingText;
        }
    }

    // 2. YouTube Mobile Share Link Fix (Converts youtu.be/ to youtube.com/embed/)
    if (text.includes("youtu.be/")) {
        var startIndex = text.indexOf("http");
        if (startIndex !== -1) {
            var remainingText = text.substring(startIndex);
            var endIndex = remainingText.search(/[\s"'>]/);
            var cleanUrl = endIndex !== -1 ? remainingText.substring(0, endIndex) : remainingText;
            
            // Extract the 11-character video ID after the slash
            var videoId = cleanUrl.split("youtu.be/").pop().split("?")[0].trim();
            return "https://youtube.com/embed/" + videoId;
        }
    }

    // 3. YouTube Standard Watch Link Fix (Converts watch?v= to /embed/)
    if (text.includes("://youtube.com/embed/")) {
        var startIndex = text.indexOf("http");
        if (startIndex !== -1) {
            var remainingText = text.substring(startIndex);
            var endIndex = remainingText.search(/[\s"'>]/);
            var cleanUrl = endIndex !== -1 ? remainingText.substring(0, endIndex) : remainingText;
            
            // Extract the video ID after the v= parameter
            var videoId = cleanUrl.split("v=").pop().split("&")[0].trim();
            return "https://youtube.com/embed/" + videoId;
        }
    }
    if (text.includes("odysee.com/") && !text.includes("/$/embed/")) {
        var startIndex = text.indexOf("http");
        if (startIndex !== -1) {
            var remainingText = text.substring(startIndex);
            var endIndex = remainingText.search(/[\s"'>]/);
            var cleanUrl = endIndex !== -1 ? remainingText.substring(0, endIndex) : remainingText;
            
            // Isolate the full video pathway string following odysee.com/
            var videoPath = cleanUrl.split("odysee.com/").pop().split("?")[0].trim();
            
            // Combine it with Odysee's required player path prefix
            return "https://odysee.com/$/embed/" + videoPath;
        }
    }
    return null;
}

function createPost() {
    var textarea = document.getElementById('postText');
    var text = textarea.value.trim();
    if (!text) return;

    var feed = document.getElementById('postFeed');
    var post = document.createElement('div');
    post.className = 'post';

    // The text on the post remains exactly what the user typed (retains the original URL text)
    var embedUrl = extractVideoEmbed(text);    
    var postTextDiv = document.createElement('div');
    postTextDiv.className = 'post-text';
    //postTextDiv.textContent = text;
    if (embedUrl) {
        // Find the exact web link inside the text box (starts at http)
        var linkStart = text.indexOf("http");
        var remainingFromLink = text.substring(linkStart);
        var linkEndRelative = remainingFromLink.search(/[\s"'>]/);
        
        // Isolate the exact URL string that the user pasted
        var rawUserUrl = linkEndRelative !== -1 ? remainingFromLink.substring(0, linkEndRelative) : remainingFromLink;
        
        // Erase just that raw URL from the post text, keeping all other typed comments
        postTextDiv.textContent = text.replace(rawUserUrl, "").trim();
    } else {
        // If there's no video embed, just display the user's plain text post normally
        postTextDiv.textContent = text;
    }
    post.appendChild(postTextDiv);

    //var embedUrl = extractVideoEmbed(text);
    if (embedUrl) {
        var videoContainer = document.createElement('div');
        videoContainer.className = 'video-container';
        
        var iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        iframe.allowFullscreen = true;
        
        videoContainer.appendChild(iframe);
        post.appendChild(videoContainer);
    }

    feed.insertBefore(post, feed.firstChild);
    textarea.value = '';
}
</script>
</body>
</html>
